[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-kickstart"
version = "0.3.0"
description = "A project-local beginner-facing harness for Claude Code"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{name = "Hermes Labs"}]
keywords = [
  "claude-code",
  "onboarding",
  "beginner-friendly",
  "cli",
  "developer-tools",
  "agent-harness",
  "project-scaffolding",
  "guided-setup",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Education",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/hermes-labs-ai/agent-kickstart"
Repository = "https://github.com/hermes-labs-ai/agent-kickstart"
Issues = "https://github.com/hermes-labs-ai/agent-kickstart/issues"
Documentation = "https://github.com/hermes-labs-ai/agent-kickstart#readme"
Changelog = "https://github.com/hermes-labs-ai/agent-kickstart/releases"

[project.scripts]
agent-kickstart = "agent_kickstart.cli:main"
claude-kickstart = "agent_kickstart.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_kickstart = [
  "assets/.claude/commands/*.md",
  "assets/.claude/settings.json",
  "assets/agent-kickstart/*.md",
  "assets/agent-kickstart/bin/*.mjs",
  "assets/agent-kickstart/state/.gitignore",
  "assets/agent-kickstart/creations/.gitignore",
]

[tool.ruff.lint]
# Pinned explicitly so a new Ruff release cannot silently change what the
# Hermes gate enforces. This is Ruff's long-standing default set: Pyflakes
# plus the pycodestyle errors that catch real defects, not style preferences.
select = ["E4", "E7", "E9", "F"]
